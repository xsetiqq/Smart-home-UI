<mat-tab-group
  animationDuration="0ms"
  mat-stretch-tabs="false"
  mat-align-tabs="center"
  class="stretched-tabs"
>
  @for (tab of tabs$ | async; track tab) {
  <mat-tab>
    <ng-template mat-tab-label>{{ tab.title }}</ng-template>
    <div class="list-container">
      <app-card-list [cards]="tab.cards"></app-card-list>
    </div>
  </mat-tab>
  }
</mat-tab-group>
