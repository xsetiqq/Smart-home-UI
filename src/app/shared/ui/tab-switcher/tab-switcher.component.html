
<mat-tab-group animationDuration="700ms" dynamicHeight mat-stretch-tabs="false" mat-align-tabs="start" class="stretched-tabs">


  @for (tab of tabs$ | async; track tab) {
    <mat-tab>
      
      <ng-template mat-tab-label>{{tab.title}}</ng-template>
     
      @for (item of tab.cards; track item.id) {
          <ng-container> <p>{{item.title}}</p></ng-container>
      }
          
    </mat-tab>
  }
</mat-tab-group>
