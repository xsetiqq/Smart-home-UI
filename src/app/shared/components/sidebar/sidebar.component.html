@let dashboardsArray = dashboardsArrays();

<div class="sidebar-inner">
  @if (dashboardsArray?.length) {
  <nav class="menu">
    @for (dashboard of dashboardsArray; track $index) {
    <a routerLink="/dashboard/{{ dashboard.id }}" routerLinkActive="active" class="menu-item">
      <mat-icon>{{ dashboard.icon }}</mat-icon> {{ dashboard.title }}
    </a>
    }

    
  </nav>
  }
</div>
