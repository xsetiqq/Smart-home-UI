<nav
  mat-tab-nav-bar
  class="stretched-tabs"
  animationDuration="0ms"
  mat-stretch-tabs="false"
    [tabPanel]="panel"
  mat-align-tabs="center"
>
  @for (tab of dashboard()?.tabs; track tab.id) {
  <a
    mat-tab-link
    [routerLink]="[tab.id]"
    routerLinkActive
    #rla="routerLinkActive"
    [active]="rla.isActive"
  >
    {{ tab.title }}
  </a>
  }
</nav>
<mat-tab-nav-panel #panel></mat-tab-nav-panel>
