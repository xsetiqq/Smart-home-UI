<div class="form">
  <h1>Login</h1>
  <form class="form-box" [formGroup]="myForm">
    <mat-form-field>
      <mat-label>Enter Name</mat-label>
      <input matInput placeholder="Donald" formControlName="username" />

      @if (!myForm.controls.username.valid && myForm.controls.username.touched) {
      <mat-error> Username is required </mat-error>

      }
    </mat-form-field>
    <mat-form-field>
      <mat-label>Enter password</mat-label>
      <input
        matInput
        placeholder="Enter your password"
        formControlName="password"
        type="password"
      />
      @if (!myForm.controls.password.valid && myForm.controls.password.touched) {
      <mat-error> Password is required </mat-error>
      }
    </mat-form-field>

    <button type="submit" matButton="filled" (click)="handleSubmit()" [disabled]="!myForm.valid">
      @if (isLoading) {
      <mat-spinner diameter="20"></mat-spinner>
      } @else { Login }
    </button>
  </form>
  <div class="auth-error">
    @if (errorMessage) {
    <mat-icon>error</mat-icon>
    {{ errorMessage }}
    } @else {
    <span style="height: 24px">&nbsp;</span>
    }
  </div>
</div>
